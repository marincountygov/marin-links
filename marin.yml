schema: 1

project:
  name: Marin Links
  repo: marin-links
  type: app
  owner: County of Marin
  audience: staff
  status: alpha

platform:
  shell: 1.22.1

deployment:
  target: github-pages
  url: https://marincountygov.github.io/marin-links/

ai:
  used: false

services:
  brand-center:
    name: Marin Brand Center
    purpose: Supplies the Marin logos offered in the QR code Logo list
    runs: browser
    visitor-data: true
  links-server:
    name: Marin Links Server
    purpose: Registers user-requested short URLs, tracks link visits, and serves public aggregate statistics
    runs: browser
    visitor-data: true
    url: https://l.marinhhs.org/
    source-path: /marin-links/
